[workspace]
resolver = "2"

members = [
    "xtask",
    "crates/soyuz-math",
    "crates/soyuz-core",
    "crates/soyuz-sdf",
    "crates/soyuz-render",
    "crates/soyuz-script",
    "crates/soyuz-engine",
    "crates/soyuz-wasm",
    "crates/soyuz-mcp",
    "app",
]

# Vendored dependency patched onto dioxus 0.8 (see [patch.crates-io] below); it is a
# patch target, not a workspace member.
exclude = ["vendor/dioxus-sdk-time"]

[workspace.package]
version = "0.7.1"
edition = "2024"
authors = ["Noah Sabaj"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/noahsabaj/soyuz"
description = "Procedural asset generation through code"
keywords = ["procedural", "3d", "sdf", "gamedev", "assets"]
categories = ["game-development", "graphics", "rendering"]

[workspace.dependencies]
# Math
glam = "0.29"

# Image handling
image = "0.25"

# 3D export
gltf = "1.4"

# GPU
wgpu = "25"
bytemuck = { version = "1.18", features = ["derive"] }
glyphon = "0.9"

# Scripting
rhai = "1.20"

# Desktop app
dioxus = "0.8.0-alpha.0"
dioxus-stores = "0.8.0-alpha.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async
tokio = { version = "1.41", features = ["fs", "time", "rt", "sync", "macros", "rt-multi-thread"] }
pollster = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
rayon = "1.10"
parking_lot = "0.12"
notify = "7.0"
notify-debouncer-mini = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"

# REPL
rustyline = "14.0"

# Testing
approx = "0.5"
proptest = "1.6"

[workspace.lints.clippy]
# Set lower priority for lint groups so individual lints can override
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Allow these pedantic lints that are too noisy
module_name_repetitions = "allow"
too_many_arguments = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
format_push_string = "allow"
doc_markdown = "allow"  # Type names in docs don't need backticks
return_self_not_must_use = "allow"  # Builder pattern methods
uninlined_format_args = "allow"  # Not always clearer
needless_raw_string_hashes = "allow"  # Raw strings can have hashes for consistency
unit_arg = "allow"  # Matching over () is fine
ignored_unit_patterns = "allow"  # `|_|` for unit-typed EventHandler closures is idiomatic in Dioxus
redundant_closure_for_method_calls = "allow"  # Closures are often clearer
used_underscore_binding = "allow"  # Underscore prefixes are intentional

[workspace.lints.rust]
unsafe_code = "warn"

# `dioxus-primitives` depends on `dioxus-sdk-time = "0.7"`, which drags a second
# dioxus (0.7.9) into the tree — `dx` rejects mixed dioxus versions. Repin it onto
# our dioxus 0.8 via a minimal vendored copy so the whole tree uses one dioxus.
[patch.crates-io]
dioxus-sdk-time = { path = "vendor/dioxus-sdk-time" }
