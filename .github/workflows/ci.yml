name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libspeechd-dev libxkbcommon-dev libssl-dev libgtk-3-dev libatk1.0-dev \
            libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The soyuz-side generated artifacts (SOYUZ_API.json, api_generated.rs,
      # docs_generated.rs, SOYUZ_COOKBOOK.md, theme.css, theme_generated.rs) are
      # validated here with --soyuz-only. The website-integrated variant of the
      # same check (website's generated-theme.css / docs.generated.ts) needs the
      # private soyuz-website checked out as a sibling, which this job's
      # GITHUB_TOKEN can't clone — it runs in the soyuz-website deploy CI
      # (which clones public soyuz) instead.
      - name: Generated docs artifacts check
        run: cargo run -p xtask -- docs check --soyuz-only

      - name: Generated theme artifacts check
        run: cargo run -p xtask -- theme check --soyuz-only

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build
        run: cargo build --release

      - name: Studio product smoke
        run: cargo run -p xtask -- studio-smoke --mode fast

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build crates/soyuz-wasm --target web
