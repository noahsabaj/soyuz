name: Release

# Builds and packages the desktop app for a pushed `v*` tag.
#
# IMPORTANT: the app loads its CSS/JS from `asset!()` files that are only placed
# next to the binary by `dx build` / `dx bundle`. A plain `cargo build --release`
# ships an UNSTYLED app (the assets aren't bundled). So every artifact here is
# produced with the Dioxus CLI:
#   - `dx build --release` -> a self-contained bundle dir (binary + assets/) that
#     we tar/zip as the portable download.
#   - `dx bundle --release --package-types <deb|appimage|dmg|msi>` -> native
#     installers with assets, icons and desktop integration handled by dx.
env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.8.0-alpha.0

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libspeechd-dev libxkbcommon-dev libssl-dev libgtk-3-dev libatk1.0-dev \
            libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI (dx)
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall dioxus-cli@${{ env.DX_VERSION }} --no-confirm --locked

      - name: Build styled bundle (binary + assets)
        run: dx build --release --package soyuz-app --platform desktop

      - name: Create portable tar.gz
        run: |
          BUNDLE=target/dx/soyuz-studio/release/linux/app
          mkdir -p soyuz-linux
          cp -r "$BUNDLE"/. soyuz-linux/
          cp README.md LICENSE-MIT LICENSE-APACHE soyuz-linux/
          tar -czf soyuz-${{ github.ref_name }}-linux-x86_64.tar.gz soyuz-linux

      - name: Bundle .deb, .rpm and .AppImage
        run: dx bundle --release --package soyuz-app --package-types deb --package-types rpm --package-types appimage

      - name: Collect installers
        run: |
          cp target/dx/soyuz-studio/bundle/linux/deb/*.deb \
            soyuz-${{ github.ref_name }}-linux-x86_64.deb
          cp target/dx/soyuz-studio/bundle/linux/rpm/*.rpm \
            soyuz-${{ github.ref_name }}-linux-x86_64.rpm
          cp target/dx/soyuz-studio/bundle/linux/appimage/*.AppImage \
            soyuz-studio-${{ github.ref_name }}-linux-x86_64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            soyuz-${{ github.ref_name }}-linux-x86_64.tar.gz
            soyuz-${{ github.ref_name }}-linux-x86_64.deb
            soyuz-${{ github.ref_name }}-linux-x86_64.rpm
            soyuz-studio-${{ github.ref_name }}-linux-x86_64.AppImage

  build-macos:
    # macos-latest is Apple Silicon (arm64). Intel (x86_64) support via a matrix
    # is a follow-up; the previous "universal" build shipped unstyled, so an arm64
    # styled build is a net improvement.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI (dx)
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall dioxus-cli@${{ env.DX_VERSION }} --no-confirm --locked

      - name: Bundle .dmg (styled, arm64)
        run: dx bundle --release --package soyuz-app --package-types dmg

      - name: Collect installer
        run: |
          # dx nests the dmg under bundle/macos/macos/; find it rather than guess.
          dmg=$(find target/dx/soyuz-studio/bundle -name '*.dmg' | head -1)
          cp "$dmg" soyuz-${{ github.ref_name }}-macos-aarch64.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: soyuz-${{ github.ref_name }}-macos-aarch64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI (dx)
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall dioxus-cli@${{ env.DX_VERSION }} --no-confirm --locked

      - name: Build styled bundle (binary + assets)
        run: dx build --release --package soyuz-app --platform desktop

      - name: Create portable zip
        shell: pwsh
        run: |
          $bundle = "target/dx/soyuz-studio/release/windows/app"
          New-Item -ItemType Directory -Force -Path soyuz-windows | Out-Null
          Copy-Item "$bundle/*" soyuz-windows/ -Recurse
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE soyuz-windows/
          Compress-Archive -Path soyuz-windows/* -DestinationPath soyuz-${{ github.ref_name }}-windows-x86_64.zip

      - name: Bundle .msi
        run: dx bundle --release --package soyuz-app --package-types msi

      - name: Collect installer
        shell: pwsh
        run: |
          Copy-Item target/dx/soyuz-studio/bundle/windows/msi/*.msi soyuz-${{ github.ref_name }}-windows-x86_64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            soyuz-${{ github.ref_name }}-windows-x86_64.zip
            soyuz-${{ github.ref_name }}-windows-x86_64.msi

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux-artifacts/*
            artifacts/macos-artifacts/*
            artifacts/windows-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
