[package]
name = "soyuz-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Noah Sabaj"]
description = "Soyuz Desktop Application"

[[bin]]
name = "soyuz-studio"
path = "src/main.rs"

[dependencies]
soyuz-core = { path = "../crates/soyuz-core" }
soyuz-engine = { path = "../crates/soyuz-engine" }
soyuz-script = { path = "../crates/soyuz-script" }

dioxus = { workspace = true }
dioxus-stores = { workspace = true }
# Headless, ARIA-accessible UI primitives (Radix port). Only a 0.0.0 name-holder is
# on crates.io; the real library lives in this repo's `0.8` branch, which pins the
# same `dioxus = "=0.8.0-alpha.0"` we use. Pinned to an exact commit (not the branch
# head) so a `cargo update` can't drag in a breaking change from this pre-1.0 branch.
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "ff5198207a3a822d344401cfcb704f180591d2e3" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# For file dialogs - use xdg-portal backend (works better with Dioxus)
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# For shared state between UI and preview
parking_lot = { workspace = true }

# For session persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

# For window icon
image = { version = "0.25", default-features = false, features = ["png"] }

# For clipboard operations
arboard = "3.4"

# For markdown rendering in cookbook
pulldown-cmark = "0.13"

# For fuzzy string matching in command palette
strsim = "0.11"

# For the startup "check for updates" against the GitHub Releases API.
# ureq is a light blocking HTTP client on rustls (no OpenSSL); it reuses the
# rustls/ring stack already in the tree and runs inside spawn_blocking so the
# check never blocks the UI. semver does the strict version comparison.
# webbrowser opens the release page in the default browser (already pulled in
# transitively by dioxus-desktop, so it adds no new transitive dependencies).
ureq = "3"
semver = "1"
webbrowser = "1"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[lints]
workspace = true

[package.metadata.deb]
name = "soyuz-studio"
maintainer = "Noah Sabaj"
copyright = "2024, Noah Sabaj"
extended-description = """
Soyuz Studio is a desktop IDE for procedural 3D asset generation.
Write scripts to define shapes using Signed Distance Fields (SDFs),
preview them in real-time, and export to common 3D formats.
"""
section = "graphics"
priority = "optional"
assets = [
    ["target/release/soyuz-studio", "usr/bin/", "755"],
    ["../assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/soyuz-studio.png", "644"],
    ["../assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/soyuz-studio.png", "644"],
    ["../assets/icons/icon-64.png", "usr/share/icons/hicolor/64x64/apps/soyuz-studio.png", "644"],
    ["../assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/soyuz-studio.png", "644"],
    ["../assets/soyuz-studio.desktop", "usr/share/applications/soyuz-studio.desktop", "644"],
]

[package.metadata.wix]
upgrade-guid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
path-guid = "B2C3D4E5-F6A7-8901-BCDE-F23456789012"
license = false
eula = false
