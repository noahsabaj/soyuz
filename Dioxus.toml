[application]
name = "Soyuz Studio"
asset_dir = "app/assets"
sub_package = "soyuz-app"

[web.app]
title = "Soyuz Studio"

[web.watcher]
watch_path = ["app/src", "app/assets", "Cargo.toml", "app/Cargo.toml", "Dioxus.toml"]

[bundle]
identifier = "dev.soyuz.studio"
publisher = "Noah Sabaj"
category = "DeveloperTool"
short_description = "Desktop IDE for procedural 3D asset generation."
long_description = "Soyuz Studio is a desktop IDE for writing SDF scripts, previewing procedural 3D assets, and exporting common 3D formats."
# icon.ico already embeds 48/64/128/256 PNGs; listing those sizes as separate
# .png files too makes `dx bundle --package-types rpm` fail with duplicate
# hicolor paths. Keep only the 16/32 PNGs (not in the .ico) plus the .ico, which
# covers 48-256 for Linux and is the Windows (.msi) icon source.
icon = [
    "assets/icons/icon-16.png",
    "assets/icons/icon-32.png",
    "assets/icons/icon.ico",
]

# Ship the AppStream metainfo at /usr/share/metainfo/ so software centres show
# "Soyuz Studio" by "Noah Sabaj" with the app icon (not the filename +
# "Unknown author"). Paths are relative to the app package dir, like `icon`.
[bundle.deb]
files = { "/usr/share/metainfo/dev.soyuz.studio.metainfo.xml" = "packaging/dev.soyuz.studio.metainfo.xml" }

[bundle.rpm]
files = { "/usr/share/metainfo/dev.soyuz.studio.metainfo.xml" = "packaging/dev.soyuz.studio.metainfo.xml" }
