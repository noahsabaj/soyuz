[package]
name = "soyuz-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WGPU-based raymarching renderer for Soyuz"

[dependencies]
soyuz-core = { path = "../soyuz-core" }
soyuz-sdf = { path = "../soyuz-sdf" }

# GPU
wgpu = { workspace = true }
bytemuck = { workspace = true }
glyphon = { workspace = true }

# Math
glam = { workspace = true }

# Windowing
winit = { version = "0.30", features = ["x11", "wayland"] }
raw-window-handle = "0.6"

# Async
pollster = { workspace = true }

# Image output
image = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Sets the embedded child's X11 background pixel so any exposure before the
# first frame shows the studio's preview pane color instead of server-default
# white. Already in the dependency tree via winit's X11 backend.
x11rb = "0.13"

[lints]
workspace = true
